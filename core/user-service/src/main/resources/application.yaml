server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: false  # Отключаем Config Server временно
      fail-fast: false

  # Локальная конфигурация
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update  # Изменено с validate на update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

eureka:
  client:
    enabled: false  # Отключаем Eureka временно
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    ru.practicum: INFO
    org.springframework: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type: TRACE