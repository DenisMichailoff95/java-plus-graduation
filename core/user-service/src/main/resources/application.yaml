server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      enabled: false  # Временно отключаем Config Server
      fail-fast: false

  # Локальная конфигурация базы данных
  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # Конфигурация JPA
  jpa:
    hibernate:
      ddl-auto: validate  # Изменено с update на validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Spring MVC
  mvc:
    format:
      date-time: yyyy-MM-dd HH:mm:ss

# Eureka конфигурация (временно отключаем)
eureka:
  client:
    enabled: false  # Отключаем Eureka до решения проблем с базой
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator для мониторинга
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Логирование
logging:
  level:
    ru.practicum: INFO
    org.springframework: WARN
    org.hibernate.SQL: DEBUG